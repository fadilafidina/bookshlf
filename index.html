<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookshelf</title>
  <meta name="description" content="Turn any public Goodreads shelf into a wall of book spines." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='6' width='6' height='22' fill='%238c2f2b'/><rect x='11' y='3' width='5' height='25' fill='%232f4f3e'/><rect x='17' y='8' width='7' height='20' fill='%23c79a3b'/><rect x='2' y='28' width='28' height='3' fill='%235a3d2b'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <p class="eyebrow">bookshlf</p>
        <h1 id="title">A bookshelf</h1>
        <p class="stats" id="stats">&nbsp;</p>
      </div>
      <form class="build" id="build-form" autocomplete="off">
        <label for="build-input">Build yours from Goodreads</label>
        <div class="build-row">
          <input id="build-input" name="user" type="text" inputmode="url"
                 placeholder="goodreads.com/user/show/12345-you" required />
          <button type="submit">Build</button>
        </div>
      </form>
    </div>

    <nav class="controls" aria-label="Shelf options">
      <div class="seg" role="tablist" id="shelf-tabs">
        <button role="tab" data-shelf="read">Read</button>
        <button role="tab" data-shelf="currently-reading">Reading now</button>
        <button role="tab" data-shelf="to-read">To read</button>
      </div>
      <div class="seg" id="group-tabs">
        <span class="seg-label">Shelve by</span>
        <button data-by="year">Year</button>
        <button data-by="rating">Rating</button>
        <button data-by="colour">Colour</button>
      </div>
    </nav>
  </header>

  <main id="wall" class="wall" aria-live="polite"></main>

  <footer class="foot">
    Spine width is page count. Colour is the binding we imagined for it.
    Data from public Goodreads shelves.
  </footer>

  <dialog id="book" class="book-card">
    <button class="close" id="book-close" aria-label="Put the book back">×</button>
    <div class="book-body">
      <div class="cover-wrap" id="book-cover"></div>
      <div class="book-info">
        <h2 id="book-title"></h2>
        <p class="author" id="book-author"></p>
        <p class="stars" id="book-stars"></p>
        <dl class="facts" id="book-facts"></dl>
        <p class="review" id="book-review"></p>
        <a id="book-link" target="_blank" rel="noopener">View on Goodreads →</a>
      </div>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
